<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PokeWeb: Legacy Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <main id="view-port"></main>

        <div id="battle-scene" class="hidden">
            <div class="battle-top">
                <div class="unit-info opponent">
                    <div class="name-bar"><span id="opp-name">---</span> <span id="opp-lv">Lv.0</span></div>
                    <div class="hp-track"><div id="opp-hp-fill" class="hp-fill"></div></div>
                </div>
                <img id="opp-sprite" alt="상대 포켓몬" style="visibility:hidden">
            </div>
            <div class="battle-bottom">
                <img id="player-sprite" alt="내 포켓몬" style="visibility:hidden">
                <div class="unit-info player">
                    <div class="name-bar"><span id="p-name">---</span> <span id="p-lv">Lv.0</span></div>
                    <div class="hp-track"><div id="p-hp-fill" class="hp-fill"></div></div>
                    <div class="exp-track"><div id="p-exp-fill" class="exp-fill"></div></div>
                </div>
            </div>
            <div id="battle-log">전투가 시작되었습니다!</div>
            <div id="battle-menu">
                <div id="move-list"></div>
                <div id="sub-menu">
                    <button id="btn-catch">🔴 포켓볼</button>
                    <button id="btn-run">🏃 도망</button>
                </div>
            </div>
        </div>

        <nav id="tab-bar">
            <button id="tab-wild">🌿 야생</button>
            <button id="tab-pvp">👥 대전</button>
            <button id="tab-team">🎒 팀</button>
            <button id="tab-pokedex">📖 도감</button>
            <button id="tab-rank">🏆 랭킹</button>
            <button id="tab-box">📦 박스</button>
        </nav>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <h1 class="pixel">POKEMON</h1>
            <input type="text" id="login-id" placeholder="ID">
            <input type="password" id="login-pw" placeholder="PASSWORD">
            <button id="btn-login">접속</button>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('tab-wild').addEventListener('click', function () { game.ui.changeTab('wild'); });
            document.getElementById('tab-pvp').addEventListener('click', function () { game.ui.changeTab('pvp'); });
            document.getElementById('tab-team').addEventListener('click', function () { game.ui.changeTab('team'); });
            document.getElementById('tab-pokedex').addEventListener('click', function () { game.ui.changeTab('pokedex'); });
            document.getElementById('tab-rank').addEventListener('click', function () { game.ui.changeTab('rank'); });
            document.getElementById('tab-box').addEventListener('click', function () { game.ui.changeTab('box'); });
            document.getElementById('btn-login').addEventListener('click', function () { game.auth.login(); });
        });
    </script>
</body>
</html>
